[package]
name = "nemo-fr"
version = "0.1.0"
edition = "2021"

# Isolated workspace so this POC doesn't get pulled into the parent dictee crate.
[workspace]

[dependencies]
# cuda feature compiled in; provider chosen at runtime via env NEMO_CUDA=1
# (falls back to CPU otherwise, and parakeet-rs falls back to CPU if CUDA init fails).
parakeet-rs = { version = "0.3.6", features = ["cuda"] }
