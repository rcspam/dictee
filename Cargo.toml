# Originally derived from parakeet-rs by altunenes (GPL-3.0-or-later).
# Now the standalone ASR engine of the dictee project — no longer a fork.
[package]
name = "dictee-asr"
version = "1.4.0-beta"
edition = "2021"
authors = ["rcspam <contact@theia-ee.fr>", "altunenes (original parakeet-rs author)"]
description = "dictee ASR & speaker diarization engine (ONNX): Parakeet TDT, Canary, Nemotron, Sortformer"
repository = "https://github.com/rcspam/dictee"
license = "GPL-3.0-or-later"
keywords = ["speech-recognition", "asr", "diarization", "onnx", "dictee"]
categories = ["multimedia::audio", "science"]

[lib]
name = "parakeet_rs"
path = "src/lib.rs"

[[example]]
name = "diarization"
path = "examples/diarization.rs"

[[example]]
name = "raw"
path = "examples/raw.rs"

[[example]]
name = "streaming"
path = "examples/streaming.rs"

[[bin]]
name = "transcribe"
path = "src/bin/transcribe.rs"

[[bin]]
name = "transcribe-daemon"
path = "src/bin/transcribe_daemon.rs"

[[bin]]
name = "transcribe-client"
path = "src/bin/transcribe_client.rs"

[[bin]]
name = "transcribe-diarize"
path = "src/bin/transcribe_diarize.rs"

[[bin]]
name = "transcribe-diarize-batch"
path = "src/bin/transcribe_diarize_batch.rs"

[[bin]]
name = "transcribe-stream-diarize"
path = "src/bin/transcribe_stream_diarize.rs"

[[bin]]
name = "diarize-only"
path = "src/bin/diarize_only.rs"

[[bin]]
name = "diarize-multi"
path = "src/bin/diarize_multi.rs"

[[bin]]
name = "transcribe-daemon-whisper-rust"
path = "src/bin/transcribe_daemon.rs"

[[bin]]
name = "dictee-app-capture"
path = "src/bin/app_capture.rs"

[dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray"] }
hound = "3.5"
# diar feature (src/diar/): pure-Rust dependencies ON PURPOSE — ndarray-linalg
# is forbidden here (it flips ndarray's `blas` feature on, which unifies into
# every ASR binary and breaks linking with undefined cblas_sgemm).
kodama = { version = "0.3", optional = true }
nalgebra = { version = "0.34", default-features = false, features = ["std"], optional = true }
ndarray-npy = { version = "0.10", default-features = false, optional = true }
whisper-rs = { version = "0.16", default-features = false, optional = true }
eyre = "0.6"
ndarray = "0.17"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustfft = "6.4"
ctrlc = "3.4"
libc = "0.2"
pipewire = "0.8"

[dev-dependencies]
approx = "0.5"

[features]
default = ["cpu", "ort-defaults"]
cpu = []
ort-defaults = ["ort/default"]
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]
coreml = ["ort/coreml"]
directml = ["ort/directml"]
migraphx = ["ort/migraphx"]
openvino = ["ort/openvino"]
webgpu = ["ort/webgpu"]
nnapi = ["ort/nnapi"]
sortformer = []
# In-house multi-speaker diarization engine (src/diar/, no 4-speaker cap).
diar = ["dep:kodama", "dep:nalgebra", "dep:ndarray-npy"]
whisper        = ["dep:whisper-rs", "whisper-rs/raw-api"]
whisper-vulkan = ["whisper", "whisper-rs/vulkan"]
whisper-cuda   = ["whisper", "whisper-rs/cuda"]
# api-23 pins the OrtApi bindings to ONNX Runtime 1.23 — must match the
# libonnxruntime.so shipped in /usr/lib/dictee (rc.12 defaults to api-24).
load-dynamic = ["ort/load-dynamic", "ort/api-23"]
preload-dylibs = ["ort/preload-dylibs"]
