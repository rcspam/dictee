name: Rust

on:
  push:
    branches: [ "master", "release/*" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Bash syntax check
      run: |
        for f in dictee dictee-switch-backend dictee-test-rules; do
          echo "Checking $f..."
          bash -n "$f"
        done
    - name: Python syntax check
      run: |
        for f in dictee-setup.py dictee-tray.py dictee-ptt.py dictee-postprocess.py dictee-transcribe.py dictee_models.py; do
          echo "Checking $f..."
          python3 -m py_compile "$f"
        done
    - name: Gettext locale check
      run: |
        sudo apt-get install -y gettext > /dev/null
        for f in po/*.po; do
          echo "Checking $f..."
          msgfmt --check --output=/dev/null "$f"
        done

  test-postprocess:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install Python test deps
      run: python3 -m pip install --user text2num
    - name: Run postprocess tests
      run: python3 tests/test-postprocess.py -v
      env:
        XDG_CONFIG_HOME: /tmp/dictee-ci-noconfig

  test-keycode-tables:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    # evdev supplies the kernel keycode constants the tables are checked
    # against; PyQt6 is needed to confirm each label still yields a shortcut.
    # Both come from apt, not pip: the PyQt6 wheel ships no system libraries,
    # so importing it on a hosted runner dies on a missing libEGL and the Qt
    # check silently skipped itself. These are also the very packages dictee
    # depends on, so the test runs against what users get.
    - name: Install Python test deps
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pyqt6 python3-evdev
    - name: Run keycode table tests
      run: python3 tests/test-keycode-tables.py
      env:
        XDG_CONFIG_HOME: /tmp/dictee-ci-noconfig
        QT_QPA_PLATFORM: offscreen

  test-key-capture:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    # apt, not pip: this file imports QApplication at module level, and the
    # PyQt6 wheel has no system libraries behind it, so on a hosted runner the
    # import died on libEGL and took the whole job down.
    #
    # This test loads dictee-setup.py whole, so it needs every Qt module the
    # program imports outside a try: QtCore, QtSvg and QtSvgWidgets, the last
    # two living in the .qtsvg package. QtMultimedia is optional in the code
    # but installed anyway, so the test exercises the branch users run. This
    # is the Qt half of the packages' Depends, verbatim.
    - name: Install Python test deps
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pyqt6 python3-pyqt6.qtsvg \
                                python3-pyqt6.qtmultimedia python3-evdev
    # Without this the job was green having run 1 case out of 9: every
    # uinput-backed test skipped itself on "/dev/uinput cannot be opened for
    # writing", leaving only the Qt fallback. The module is loadable on hosted
    # runners, it is simply not loaded, and its node is root-only.
    #
    # Deliberately non-fatal: on a runner image where the module is absent,
    # the tests skip exactly as they did before instead of turning the job
    # red. The daemon cases stay skipped either way, no dictee-ptt here.
    - name: Make /dev/uinput usable
      run: |
        sudo modprobe uinput || true
        sudo chmod 666 /dev/uinput || true
        # Opening /dev/uinput is only half of it: each fake keyboard appears as
        # a NEW /dev/input/eventN, created during the test and root-only, so a
        # one-off chmod cannot reach it. A udev rule covers the nodes that do
        # not exist yet. On a real machine the input group does this job.
        printf 'KERNEL=="event*", MODE="0666"\n' \
          | sudo tee /etc/udev/rules.d/99-dictee-ci-input.rules > /dev/null
        sudo udevadm control --reload-rules || true
        sudo udevadm trigger || true
        ls -l /dev/uinput || echo "no /dev/uinput: the uinput cases will skip"
    - name: Run key capture tests
      run: python3 tests/test-key-capture.py
      env:
        XDG_CONFIG_HOME: /tmp/dictee-ci-noconfig
        QT_QPA_PLATFORM: offscreen

  test-keyboard-detection:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install Python test deps
      run: python3 -m pip install --user evdev
    # This job used to report OK on 6 tests out of 6 skipped: every case here
    # builds a fake device, so without a writable /dev/uinput it asserted
    # nothing at all. Same non-fatal load as in test-key-capture -- if the
    # module is unavailable the tests skip as before rather than fail.
    - name: Make /dev/uinput usable
      run: |
        sudo modprobe uinput || true
        sudo chmod 666 /dev/uinput || true
        ls -l /dev/uinput || echo "no /dev/uinput: these tests will skip"
    # Builds uinput devices matching the hardware from issues #10, #23 and #30.
    - name: Run keyboard detection tests
      run: python3 tests/test-keyboard-detection.py

  test-apply-continuation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Run apply_continuation tests
      run: bash tests/test-apply-continuation.sh

  test-transcribe-routing:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Run dictee-transcribe routing tests
      run: python3 tests/test-transcribe-routing.py -v

  packaging-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install PyYAML
      run: python3 -m pip install --user pyyaml
    - name: Audit packaging deps manifest vs builders
      run: python3 packaging/audit-deps.py

  test-install-arch-source:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Verify the Arch installer resolves to an existing source tarball
      # Guards against issue #17: the Arch install path must clone a ref
      # whose PKGBUILD _tag points at a tarball that actually exists (HTTP
      # 200). Catches a master bump to an unreleased version, a stale
      # hard-coded branch, or any tag/_tag mismatch — before users hit it.
      run: bash tests/test-install-arch-source.sh

  test-x86:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  test-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v5
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  release:
    needs: [lint, test-postprocess, test-apply-continuation, test-transcribe-routing, packaging-audit, test-install-arch-source, test-x86, test-arm64]
    # Disabled: dictee ships locally-built CUDA assets that CI cannot produce,
    # so a tag push must NOT auto-publish an empty release (it would also flip
    # the GitHub "Latest" pointer and break install.sh's asset lookup for
    # everyone). Releases are published manually via `gh` with the local
    # .dev/dist/ assets. Re-enable only once CI can build+upload the assets.
    if: false && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
